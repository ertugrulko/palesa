<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palesa's Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@400;500&family=Pinyon+Script&display=swap">
<style>
/* Layout: full-bleed WebGL night garden; a thin type layer floats above it (intro centered, messages at the foot) */
:root {
  --night: #07040d;
  --plum: #1a0b22;
  --rose: #f2709c;
  --blush: #ffd6e3;
  --gold: #f6c978;
  --ink: #fbeff4;
  --muted: rgba(251, 239, 244, 0.62);
  --script: "Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive;
  --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --ui: "Jost", "Avenir Next", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--serif);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
body.no-gl { background: radial-gradient(ellipse at 50% 45%, #3a0f2c 0%, var(--plum) 40%, var(--night) 80%); }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }

#intro {
  position: fixed; inset: 0; z-index: 5;
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 24px) calc(env(safe-area-inset-bottom, 0px) + 24px);
  background: radial-gradient(ellipse at 50% 50%, rgba(7, 4, 13, 0.25) 0%, rgba(7, 4, 13, 0.82) 70%);
  transition: opacity 1.6s ease, transform 1.6s ease;
}
#intro.gone { opacity: 0; transform: scale(1.06); pointer-events: none; }
.intro-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; max-width: 36rem; }
.eyebrow {
  font-family: var(--ui); font-size: 12px; letter-spacing: 0.34em; text-transform: uppercase;
  color: var(--gold); margin: 0;
}
#intro h1 {
  margin: 0; font-family: var(--script); font-weight: 400;
  font-size: clamp(84px, 22vw, 176px); line-height: 1.05;
  padding: 0 0.2em;
  background: linear-gradient(100deg, var(--blush) 10%, var(--rose) 48%, var(--gold) 92%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 28px rgba(242, 112, 156, 0.45));
  text-wrap: balance;
}
.intro-line { margin: 0; font-style: italic; font-size: clamp(19px, 4.6vw, 24px); color: var(--muted); line-height: 1.45; max-width: 26ch; }
#start {
  margin-top: 10px;
  font-family: var(--ui); font-size: 13px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--ink);
  background: rgba(242, 112, 156, 0.14);
  border: 1px solid rgba(246, 201, 120, 0.55);
  border-radius: 999px;
  padding: 16px 36px 16px 40px;
  cursor: pointer;
  box-shadow: 0 0 0 0 rgba(242, 112, 156, 0.5);
  animation: breathe 2.8s ease-in-out infinite;
  transition: background 0.3s ease, transform 0.3s ease;
}
#start:hover { background: rgba(242, 112, 156, 0.28); transform: translateY(-1px); }
#start:focus-visible { outline: 2px solid var(--gold); outline-offset: 5px; }
.small-note { font-family: var(--ui); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin: 0; }
@keyframes breathe {
  0%, 100% { box-shadow: 0 0 0 0 rgba(242, 112, 156, 0.0), 0 0 24px rgba(242, 112, 156, 0.25); }
  50% { box-shadow: 0 0 0 10px rgba(242, 112, 156, 0.08), 0 0 44px rgba(242, 112, 156, 0.45); }
}

#ui {
  position: fixed; inset: 0; z-index: 3; pointer-events: none;
  display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 28px);
}
#msg {
  margin: 0; min-height: 2.9em; max-width: 28ch;
  display: flex; align-items: flex-end; justify-content: center;
  text-align: center; font-style: italic; font-weight: 500;
  font-size: clamp(21px, 5vw, 32px); line-height: 1.3;
  color: var(--ink);
  text-shadow: 0 0 18px rgba(242, 112, 156, 0.7), 0 0 2px rgba(7, 4, 13, 0.9);
  text-wrap: balance;
  transition: opacity 0.9s ease, transform 0.9s ease;
}
#msg.out { opacity: 0; transform: translateY(10px); }
#hint {
  margin: 0; font-family: var(--ui); font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--gold); opacity: 0; transition: opacity 1.5s ease;
}
#hint.show { opacity: 0.8; }

#sound {
  position: fixed; z-index: 4;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  right: calc(env(safe-area-inset-right, 0px) + 16px);
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(26, 11, 34, 0.55);
  border: 1px solid rgba(246, 201, 120, 0.4);
  color: var(--blush); cursor: pointer;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
#sound:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
#sound svg { width: 20px; height: 20px; }
#sound .wave { transition: opacity 0.3s; }
#sound[aria-pressed="false"] .wave { opacity: 0; }
#sound .slash { opacity: 0; transition: opacity 0.3s; }
#sound[aria-pressed="false"] .slash { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  #start { animation: none; }
  #intro, #msg { transition-duration: 0.4s; }
}
</style>

</head>
<body>
<canvas id="scene" aria-label="A 3D rose blooming for Palesa, with her name circling around it"></canvas>

<div id="ui" aria-live="polite">
  <p id="msg" class="out"></p>
  <p id="hint">Tap anywhere</p>
</div>

<audio id="song" src="song.mp3" loop preload="auto"></audio>

<button id="sound" type="button" aria-pressed="true" aria-label="Mute sound" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" fill-opacity="0.25"/>
    <path class="wave" d="M15.5 9a4 4 0 0 1 0 6"/>
    <path class="wave" d="M18 6.5a7.5 7.5 0 0 1 0 11"/>
    <path class="slash" d="M16 9.5l5 5M21 9.5l-5 5"/>
  </svg>
</button>

<section id="intro">
  <div class="intro-inner">
    <p class="eyebrow">A little garden, just for you</p>
    <h1>Palesa</h1>
    <p class="intro-line">This flower has been waiting for you. One touch is all it needs to bloom.</p>
    <button id="start" type="button">Open the garden</button>
    <p class="small-note">Sound on · tap anywhere</p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
  const MESSAGES = [
    "Palesa, this flower bloomed only for you.",
    "Your name is hidden in every petal.",
    "Your smile shines brighter than every light in this garden.",
    "With you, every season is spring.",
    "Tap the screen and let the flowers bloom for you.",
    "I'm so glad you exist, Palesa.",
    "I love you so much."
  ];
  const HEART_MESSAGE = "My heart is always yours, Palesa.";
  const SCRIPT = '"Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive';

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const M = reduce ? 0.35 : 1;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  const intro = document.getElementById("intro");
  const startBtn = document.getElementById("start");
  const soundBtn = document.getElementById("sound");
  const msgEl = document.getElementById("msg");
  const hintEl = document.getElementById("hint");

  /* ---------- messages ---------- */
  let msgIndex = 0, msgTimer = null, msgSwap = null;
  function setMsg(s) {
    msgEl.classList.add("out");
    clearTimeout(msgSwap);
    msgSwap = setTimeout(() => { msgEl.textContent = s; msgEl.classList.remove("out"); }, 900);
  }
  function nextMsg() { setMsg(MESSAGES[msgIndex % MESSAGES.length]); msgIndex++; }
  function startMessages() { nextMsg(); clearInterval(msgTimer); msgTimer = setInterval(nextMsg, 6500); }
  function interruptMsg(s) { setMsg(s); clearInterval(msgTimer); msgTimer = setInterval(nextMsg, 6500); }

  /* ---------- audio: soft pad + bells, synthesized ---------- */
  let actx = null, master = null, muted = false, padBus = null, bellBus = null, audioTimers = [];
  const VOL = 0.55;
  // Dbmaj7 – C7 – Fm7 – Ebm7 Ab7, one bar each (last bar split), in F minor
  const BAR = 2.6;
  const CHORDS = [
    { bass: 69.30, notes: [138.59, 174.61, 207.65, 261.63], bars: 1 },
    { bass: 65.41, notes: [130.81, 164.81, 196.0, 233.08], bars: 1 },
    { bass: 87.31, notes: [174.61, 207.65, 261.63, 311.13], bars: 1 },
    { bass: 77.78, notes: [155.56, 185.0, 233.08, 277.18], bars: 0.5 },
    { bass: 103.83, notes: [130.81, 155.56, 185.0, 207.65], bars: 0.5 }
  ];
  const PENTA = [523.25, 622.25, 698.46, 830.61, 932.33, 1046.5, 1244.51, 1396.91, 1661.22];
  function startAudio() {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    const now = actx.currentTime;
    master = actx.createGain();
    master.gain.setValueAtTime(0, now);
    master.gain.linearRampToValueAtTime(VOL, now + 3);
    master.connect(actx.destination);

    const conv = actx.createConvolver();
    const len = Math.floor(actx.sampleRate * 3.6);
    const ir = actx.createBuffer(2, len, actx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8);
    }
    conv.buffer = ir;
    const verb = actx.createGain(); verb.gain.value = 0.85;
    verb.connect(conv); conv.connect(master);
    const dry = actx.createGain(); dry.gain.value = 0.55; dry.connect(master);
    const delay = actx.createDelay(1.5); delay.delayTime.value = 0.42;
    const fb = actx.createGain(); fb.gain.value = 0.33;
    delay.connect(fb); fb.connect(delay); delay.connect(verb);

    const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 950; lp.Q.value = 0.4;
    padBus = lp; lp.connect(dry); lp.connect(verb);
    bellBus = actx.createGain(); bellBus.connect(dry); bellBus.connect(verb); bellBus.connect(delay);

    let ci = 0, nextAt = actx.currentTime + 0.1;
    const chord = () => {
      if (!actx) return;
      const c = CHORDS[ci++ % CHORDS.length];
      if (nextAt < actx.currentTime) nextAt = actx.currentTime + 0.05;
      playChord(c, nextAt, c.bars * BAR);
      nextAt += c.bars * BAR;
      audioTimers.push(setTimeout(chord, Math.max((nextAt - actx.currentTime - 0.4) * 1000, 0)));
    };
    chord();
    const bell = () => {
      if (!actx) return;
      const f = PENTA[Math.floor(Math.random() * PENTA.length)];
      playBell(f, actx.currentTime + 0.02, 0.05);
      audioTimers.push(setTimeout(bell, rand(700, 1900)));
    };
    audioTimers.push(setTimeout(bell, 1500));
  }
  function playChord(c, t0, dur) {
    // soft electric-piano chord: quick attack, slow fade, held for the bar
    c.notes.forEach((f, n) => {
      const ts = t0 + n * 0.018;
      [-5, 5].forEach(det => {
        const o = actx.createOscillator(); o.type = "triangle"; o.frequency.value = f; o.detune.value = det;
        const g = actx.createGain();
        g.gain.setValueAtTime(0, ts);
        g.gain.linearRampToValueAtTime(0.045, ts + 0.04);
        g.gain.setTargetAtTime(0.022, ts + 0.05, 0.6);
        g.gain.setTargetAtTime(0, t0 + dur - 0.05, 0.25);
        o.connect(g); g.connect(padBus); o.start(ts); o.stop(t0 + dur + 1.5);
      });
    });
    const b = actx.createOscillator(); b.type = "sine"; b.frequency.value = c.bass * 2;
    const bg = actx.createGain();
    bg.gain.setValueAtTime(0, t0);
    bg.gain.linearRampToValueAtTime(0.11, t0 + 0.03);
    bg.gain.setTargetAtTime(0.05, t0 + 0.05, 0.5);
    bg.gain.setTargetAtTime(0, t0 + dur - 0.05, 0.15);
    b.connect(bg); bg.connect(padBus); b.start(t0); b.stop(t0 + dur + 1);
  }
  function playBell(f, t0, gain) {
    [[1, gain, 3.2], [2.01, gain * 0.22, 1.2], [3.0, gain * 0.08, 0.6]].forEach(([mul, gv, dur]) => {
      const o = actx.createOscillator(); o.type = "sine"; o.frequency.value = f * mul;
      const g = actx.createGain();
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(gv, t0 + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(bellBus); o.start(t0); o.stop(t0 + dur + 0.05);
    });
  }
  function sparkle() {
    if (!actx || muted) return;
    const base = Math.floor(rand(3, PENTA.length - 3));
    for (let i = 0; i < 3; i++) playBell(PENTA[base + i], actx.currentTime + 0.02 + i * 0.075, 0.045);
  }
  /* the real song; the synthesized music above is the fallback if it cannot play */
  const song = document.getElementById("song");
  let useSong = false;
  function startMusic() {
    song.volume = 0;
    let p;
    try { p = song.play(); } catch (e) { startAudio(); return; }
    if (!p || !p.then) { useSong = true; fadeSong(); return; }
    p.then(() => { useSong = true; fadeSong(); }).catch(() => startAudio());
  }
  function fadeSong() {
    const t = setInterval(() => {
      song.volume = Math.min(1, song.volume + 0.05);
      if (song.volume >= 1) clearInterval(t);
    }, 150);
  }
  function setMuted(m) {
    muted = m;
    soundBtn.setAttribute("aria-pressed", String(!m));
    soundBtn.setAttribute("aria-label", m ? "Unmute sound" : "Mute sound");
    if (useSong) {
      song.muted = m;
      if (!m && song.paused) song.play().catch(() => {});
      return;
    }
    if (!actx) return;
    if (!m && actx.state === "suspended") actx.resume();
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setTargetAtTime(m ? 0 : VOL, actx.currentTime, 0.25);
  }
  soundBtn.addEventListener("click", () => setMuted(!muted));
  document.addEventListener("visibilitychange", () => {
    if (useSong) {
      if (document.hidden) song.pause(); else if (!muted) song.play().catch(() => {});
      return;
    }
    if (!actx) return;
    if (document.hidden) actx.suspend(); else if (!muted) actx.resume();
  });

  /* ---------- start ---------- */
  let started = false, startTime = 0, time = 0;
  startBtn.addEventListener("click", () => {
    if (started) return;
    started = true; startTime = time;
    intro.classList.add("gone");
    setTimeout(() => { intro.hidden = true; }, 1700);
    soundBtn.hidden = false;
    startMusic();
    setTimeout(startMessages, 4200);
    setTimeout(() => hintEl.classList.add("show"), 11000);
  });

  /* ---------- WebGL ---------- */
  if (!window.THREE) { document.body.classList.add("no-gl"); return; }
  const canvas = document.getElementById("scene");
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
  } catch (e) { document.body.classList.add("no-gl"); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x07040d, 1);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x07040d, 0.022);
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 220);
  const target = new THREE.Vector3(0, 1.0, 0);
  let dist = 11;

  scene.add(new THREE.AmbientLight(0x4a2246, 0.45));
  scene.add(new THREE.HemisphereLight(0xffc6dc, 0x1c0620, 0.45));
  const key = new THREE.DirectionalLight(0xffe8f0, 0.75); key.position.set(3, 7, 6); scene.add(key);
  const core = new THREE.PointLight(0xffc27a, 2.4, 7, 1.6); core.position.set(0, 0.9, 0); scene.add(core);
  const rimA = new THREE.PointLight(0x8a5cff, 1.6, 22); rimA.position.set(-5, 2.5, -4); scene.add(rimA);
  const rimB = new THREE.PointLight(0xff4d8d, 1.3, 22); rimB.position.set(5, -1, -3); scene.add(rimB);

  /* petal geometry: a bent, cupped plane with a colour ramp from base to tip */
  const ROSE = [0x4a031f, 0xc92a5e, 0xf28fb2];
  const LEAF = [0x08301a, 0x2c7a3e, 0x8fd18a];
  function petalGeo(len, wid, cup, curl, stops, tone, su = 10, sv = 20) {
    const g = new THREE.PlaneGeometry(1, 1, su, sv);
    const pos = g.attributes.position;
    const col = new Float32Array(pos.count * 3);
    const c0 = new THREE.Color(stops[0]), c1 = new THREE.Color(stops[1]), c2 = new THREE.Color(stops[2]), c = new THREE.Color();
    for (let i = 0; i < pos.count; i++) {
      const u = pos.getX(i), v = pos.getY(i) + 0.5;
      const w = Math.sin(Math.PI * (Math.pow(v, 1.35) * 0.9 + 0.05));
      const x = u * wid * w;
      const y = v * len;
      let z = -cup * Math.pow(2 * u, 2) * w * wid * 0.5 + curl * Math.pow(v, 2.6) * len;
      z += 0.022 * len * Math.sin(u * 14 + v * 9) * Math.abs(2 * u) * v;
      pos.setXYZ(i, x, y, z);
      if (v < 0.45) c.copy(c0).lerp(c1, v / 0.45); else c.copy(c1).lerp(c2, (v - 0.45) / 0.55);
      const vein = 1 - 0.14 * Math.exp(-Math.pow(u * 9, 2)) * (1 - v);
      const edge = 1 + 0.12 * Math.abs(2 * u) * v;
      c.multiplyScalar(tone * vein * edge);
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    }
    g.setAttribute("color", new THREE.BufferAttribute(col, 3));
    g.computeVertexNormals();
    return g;
  }

  /* the rose */
  const flower = new THREE.Group();
  flower.scale.setScalar(1.15);
  scene.add(flower);
  const petalMat = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.55, metalness: 0, emissive: 0x3a0618, emissiveIntensity: 0.35 });
  const leafMat = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.6, emissive: 0x051a0c, emissiveIntensity: 0.6 });
  const petals = [];
  const LAYERS = 7;
  for (let L = 0; L < LAYERS; L++) {
    const k = L / (LAYERS - 1);
    const count = 5 + L;
    const geo = petalGeo(0.55 + k * 1.35, 0.5 + k * 0.95, 0.36 - k * 0.12, 0.1 + k * 0.22, ROSE, 0.72 + 0.3 * k);
    for (let i = 0; i < count; i++) {
      const pivot = new THREE.Group();
      pivot.rotation.y = (i / count) * Math.PI * 2 + L * 0.9;
      const hinge = new THREE.Group();
      hinge.position.set(0, -k * 0.18, 0.04 + k * 0.22);
      hinge.add(new THREE.Mesh(geo, petalMat));
      pivot.add(hinge); flower.add(pivot);
      petals.push({ hinge, closed: 0.05 + k * 0.1, open: 0.18 + Math.pow(k, 1.2) * 1.35 + rand(-0.05, 0.05), delay: (1 - k) * 0.35, wob: rand(0, 6.28) });
    }
  }
  const sepalGeo = petalGeo(1.5, 0.42, 0.2, 0.15, LEAF, 0.9);
  for (let i = 0; i < 5; i++) {
    const pivot = new THREE.Group(); pivot.rotation.y = (i / 5) * Math.PI * 2 + 0.3;
    const hinge = new THREE.Group(); hinge.position.set(0, -0.32, 0.2);
    hinge.add(new THREE.Mesh(sepalGeo, leafMat));
    pivot.add(hinge); flower.add(pivot);
    petals.push({ hinge, closed: 0.5, open: 1.95, delay: 0, wob: rand(0, 6.28) });
  }
  const stemCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, -0.3, 0), new THREE.Vector3(0.15, -2, 0.1), new THREE.Vector3(-0.2, -4.2, 0), new THREE.Vector3(0.1, -8, -0.2)
  ]);
  const stemMat = new THREE.MeshStandardMaterial({ color: 0x1f5a35, roughness: 0.7, emissive: 0x06200f, emissiveIntensity: 0.8 });
  flower.add(new THREE.Mesh(new THREE.TubeGeometry(stemCurve, 64, 0.07, 8), stemMat));

    }
    motes.geo.attributes.position.needsUpdate = true;
    motes.geo.attributes.aAlpha.needsUpdate = true;
    motes.mat.uniforms.uOpacity.value = 0.25 + 0.75 * bloom;

    // sparks
    const drag = Math.pow(0.3, dt);
    for (let i = 0; i < sparks.n; i++) {
      if (sparkL[i] <= 0) continue;
      sparkL[i] -= dt / 1.8;
      sparkV[i * 3] *= drag; sparkV[i * 3 + 1] = sparkV[i * 3 + 1] * drag - 1.1 * dt; sparkV[i * 3 + 2] *= drag;
      sparks.pos[i * 3] += sparkV[i * 3] * dt;
      sparks.pos[i * 3 + 1] += sparkV[i * 3 + 1] * dt;
      sparks.pos[i * 3 + 2] += sparkV[i * 3 + 2] * dt;
      sparks.alpha[i] = sparkL[i] > 0 ? Math.pow(sparkL[i], 1.4) : 0;
    }
    sparks.geo.attributes.position.needsUpdate = true;
    sparks.geo.attributes.aAlpha.needsUpdate = true;

    // falling petals
    const fd = 1 - Math.min(dt * 0.7, 1);
    for (let i = 0; i < PN; i++) {
      fv[i * 3 + 1] += (-0.55 - fv[i * 3 + 1]) * Math.min(dt * 0.9, 1);
      fv[i * 3] = fv[i * 3] * fd + Math.sin(time * 0.7 + i) * 0.18 * dt;
      fv[i * 3 + 2] *= fd;
      for (let a = 0; a < 3; a++) {
        fp[i * 3 + a] += fv[i * 3 + a] * dt * M;
        fr[i * 3 + a] += fs[i * 3 + a] * dt * M;
      }
      if (fp[i * 3 + 1] < -8) resetPetal(i, false);
      dummy.position.set(fp[i * 3], fp[i * 3 + 1], fp[i * 3 + 2]);
      dummy.rotation.set(fr[i * 3], fr[i * 3 + 1], fr[i * 3 + 2]);
      dummy.scale.setScalar(fsc[i]);
      dummy.updateMatrix();
      fall.setMatrixAt(i, dummy.matrix);
    }
    fall.instanceMatrix.needsUpdate = true;

    // particle name
    if (text) {
      const assembling = started && st > 1.0;
      text.mat.uniforms.uOpacity.value = started ? clamp((st - 0.8) / 2.2, 0, 1) : 0;
      const hm = heartMode ? 1 : 0;
      const spring = 0.016 * k, damp = Math.pow(0.9, k);
      for (let i = 0; i < TN; i++) {
        const ph = text.phase[i];
        const i3 = i * 3;
        if (assembling) {
          const nx = lerp(textNorm[i * 2], heartNorm[i * 2], hm);
          const ny = lerp(textNorm[i * 2 + 1], heartNorm[i * 2 + 1], hm);
          const tx = nx * textW + Math.sin(time * 1.1 + ph * 7) * 0.025;
          const ty = textY + ny * textW + Math.cos(time * 1.3 + ph * 5) * 0.025;
          const tz = (ph - 0.5) * 0.35 + 0.8;
          text.vel[i3] += (tx - text.pos[i3]) * spring;
          text.vel[i3 + 1] += (ty - text.pos[i3 + 1]) * spring;
          text.vel[i3 + 2] += (tz - text.pos[i3 + 2]) * spring;
        }
        text.vel[i3] *= damp; text.vel[i3 + 1] *= damp; text.vel[i3 + 2] *= damp;
        text.pos[i3] += text.vel[i3] * k;
        text.pos[i3 + 1] += text.vel[i3 + 1] * k;
        text.pos[i3 + 2] += text.vel[i3 + 2] * k;
      }
      text.geo.attributes.position.needsUpdate = true;
    }

    // orbiting words
    const ringOp = started ? clamp((st - 3) / 3, 0, 1) * 0.6 : 0.08;
    rings.forEach((r, idx) => {
      r.inner.rotation.y += r.d.speed * dt * M;
      r.mat.opacity = ringOp * (0.75 + 0.25 * Math.sin(time * 1.3 + idx * 2));
    });
    ghosts.forEach(g => {
      g.s.position.y += g.v * dt * M;
      if (g.s.position.y > 14) { g.s.position.y = -10; g.s.position.x = rand(-16, 16); }
      g.mat.opacity = (started ? clamp((st - 4) / 4, 0, 1) * 0.16 : 0.04) * (0.6 + 0.4 * Math.sin(time * 0.5 + g.ph));
    });

    if (bloomPass) bloomPass.strength = 0.6 + 0.3 * bloom;
    if (composer) composer.render(dt); else renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
